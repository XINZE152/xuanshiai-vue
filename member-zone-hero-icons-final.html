<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会员专区 Hero 图标终稿 · 金色实心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f2f2f2; padding: 32px 16px;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
    }
    .cards { display: flex; flex-direction: row; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .card {
      width: 200px; background: #fff; border-radius: 18px; padding: 20px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .icon-box {
      width: 64px; height: 64px; border-radius: 16px;
      background: #FAFAF8; display: flex; align-items: center; justify-content: center;
    }
    .icon-box svg { width: 32px; height: 32px; display: block; }
    .name { font-size: 15px; font-weight: 600; color: #222; }
    .spec { font-size: 11px; color: #999; line-height: 1.6; text-align: center; }
    .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 4px; background: #C9A96E; }

    .hero-title { font-size: 13px; color: #666; font-weight: 600; margin-top: 12px; }
    .phone {
      width: 375px; background: #fff; border-radius: 32px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.1);
    }
    .screen { padding: 48px 16px 24px; background: #F6F4F0; }
    .vip-hero {
      position: relative; border-radius: 24px;
      background: linear-gradient(135deg, #2D4A3E 0%, #C9A96E 100%);
      padding: 28px 20px 22px; color: #fff; overflow: hidden;
    }
    .vip-hero-gold-line {
      position: absolute; top: 0; left: 20px; right: 20px; height: 2px;
      background: linear-gradient(90deg, transparent, #E8D6AC, transparent);
    }
    .vip-hero-content { margin-bottom: 18px; }
    .vip-hero-title { font-size: 24px; font-weight: 700; letter-spacing: 2px; }
    .vip-hero-subtitle { font-size: 13px; color: rgba(255,255,255,.78); margin-top: 6px; }
    .vip-hero-badges { display: flex; flex-direction: row; justify-content: center; gap: 10px; }
    .vip-hero-badge {
      display: flex; flex-direction: row; align-items: center; gap: 5px;
      padding: 7px 12px; border-radius: 999px;
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    }
    .vip-hero-badge-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .vip-hero-badge-icon svg { width: 18px; height: 18px; display: block; }
    .vip-hero-badge-text { font-size: 12px; color: rgba(255,255,255,.95); }
    .caption { font-size: 12px; color: #999; text-align: center; max-width: 375px; line-height: 1.7; }
  </style>
</head>
<body>

  <div class="cards">
    <!-- 1. VIP 金色实心三尖皇冠 -->
    <div class="card">
      <div class="icon-box">
        <svg viewBox="0 0 48 48" fill="#C9A96E">
          <path d="M8 31 L8 18 L12 12 L18 22 L24 8 L30 22 L36 12 L40 18 L40 31 Z" />
          <rect x="8" y="31" width="32" height="6" rx="1.6" />
        </svg>
      </div>
      <div class="name"><span class="swatch"></span>VIP</div>
      <div class="spec">经典皇冠 · 三尖+冠带（无珠宝） · 金色实心<br>扁平无阴影 · 矢量</div>
    </div>

    <!-- 2. 多重认证 金圆+白勾 -->
    <div class="card">
      <div class="icon-box">
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="20" fill="#C9A96E" />
          <path d="M15 24.5 L21 30.5 L34 16" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="name"><span class="swatch"></span>多重认证</div>
      <div class="spec">圆圈 + 对勾 · 金色实心<br>白勾镂空 · 扁平无阴影</div>
    </div>

    <!-- 3. 优先匹配 金色实心爱心 -->
    <div class="card">
      <div class="icon-box">
        <svg viewBox="0 0 48 48" fill="#C9A96E">
          <path d="M24 38 C24 38 9 29 9 18 C9 13 12.5 10 17 10 C20.5 10 23 12 24 15 C25 12 27.5 10 31 10 C35.5 10 39 13 39 18 C39 29 24 38 24 38 Z" />
        </svg>
      </div>
      <div class="name"><span class="swatch"></span>优先匹配</div>
      <div class="spec">实心爱心 · 金色<br>扁平无阴影 · 矢量</div>
    </div>
  </div>

  <div class="hero-title">在会员专区 Hero 里的实际位置</div>
  <div class="phone">
    <div class="screen">
      <div class="vip-hero">
        <div class="vip-hero-gold-line"></div>
        <div class="vip-hero-content">
          <div class="vip-hero-title">会员专属特权</div>
          <div class="vip-hero-subtitle">解锁全部嘉宾资料，遇见心仪的TA</div>
        </div>
        <div class="vip-hero-badges">
          <div class="vip-hero-badge">
            <div class="vip-hero-badge-icon">
              <svg viewBox="0 0 48 48" fill="#C9A96E"><path d="M8 31 L8 18 L12 12 L18 22 L24 8 L30 22 L36 12 L40 18 L40 31 Z" /><rect x="8" y="31" width="32" height="6" rx="1.6" /></svg>
            </div>
            <div class="vip-hero-badge-text">VIP标识</div>
          </div>
          <div class="vip-hero-badge">
            <div class="vip-hero-badge-icon">
              <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#C9A96E" /><path d="M15 24.5 L21 30.5 L34 16" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </div>
            <div class="vip-hero-badge-text">多重认证</div>
          </div>
          <div class="vip-hero-badge">
            <div class="vip-hero-badge-icon">
              <svg viewBox="0 0 48 48" fill="#C9A96E"><path d="M24 38 C24 38 9 29 9 18 C9 13 12.5 10 17 10 C20.5 10 23 12 24 15 C25 12 27.5 10 31 10 C35.5 10 39 13 39 18 C39 29 24 38 24 38 Z" /></svg>
            </div>
            <div class="vip-hero-badge-text">优先匹配</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="caption">
    三个图标统一为金色实心（#C9A96E）：三尖皇冠 / 金圆白勾 / 实心爱心。<br>
    已落进小程序：static/icons/{vip-crown,auth-check,match-love}.svg，页面用 &lt;image&gt; 引用。
  </div>

</body>
</html>
